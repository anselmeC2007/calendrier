<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calendrier des saints</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&family=Hanken+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eceff2;--panel:#fff;--ink:#1d2430;--mute:#667085;--line:#d5dbe3;--blanc:#d9cfa6;--vert:#4c7a4b;--rouge:#a5322e;--violet:#68468a;--acc:var(--vert);--accink:#fff;
 --serif:'Cormorant Garamond',Georgia,serif;--sans:'Hanken Grotesk',system-ui,sans-serif;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161c;--panel:#1b212a;--ink:#e8ecf2;--mute:#97a1b0;--line:#2d3644;--blanc:#cbbf8c;--vert:#6aa468;--rouge:#d4625c;--violet:#a384c8}}
:root[data-theme="dark"]{--bg:#12161c;--panel:#1b212a;--ink:#e8ecf2;--mute:#97a1b0;--line:#2d3644;--blanc:#cbbf8c;--vert:#6aa468;--rouge:#d4625c;--violet:#a384c8}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--sans)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
header{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin-bottom:14px}
h1{font:700 30px/1 var(--serif);margin:0}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 12px}
.btn[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
input[type=date],input[type=search]{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px}
.chip{flex:none;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:14px}
.chip b{font-weight:700}
.grid2{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start}
@media(max-width:820px){.grid2{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.mh{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:1px solid var(--line)}
.mh h2{margin:0;font:700 24px/1 var(--serif);text-transform:capitalize}
.dow,.days{display:grid;grid-template-columns:repeat(7,1fr)}
.dow{font-size:12px;color:var(--mute);text-align:center;padding:6px 0}
.d{position:relative;min-height:62px;padding:4px 5px 8px;border:0;border-top:1px solid var(--line);border-left:1px solid var(--line);background:transparent;text-align:left;display:flex;flex-direction:column;gap:2px}
.d:nth-child(7n+1){border-left:0}
.d.off{opacity:.38}
.d .n{font-weight:500;font-size:14px}
.d .s{font-size:10.5px;line-height:1.15;color:var(--mute);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
@media(max-width:560px){.d{min-height:46px}.d .s{display:none}}
.d i{position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--c)}
.d.sel{background:color-mix(in srgb,var(--acc) 16%,transparent);box-shadow:inset 0 0 0 2px var(--acc)}
.d.today .n{background:var(--ink);color:var(--bg);border-radius:999px;width:22px;height:22px;display:grid;place-items:center}
.d.sol .n{font-weight:700}
.band{height:10px;background:var(--acc)}
.det{padding:18px 18px 20px}
.when{color:var(--mute);font-size:14px;margin:0 0 4px;text-transform:capitalize}
.det h2{font:700 36px/1.05 var(--serif);margin:0 0 12px;overflow-wrap:anywhere}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tag{font-size:13px;border:1px solid var(--line);border-radius:6px;padding:2px 8px}
.tag.c{background:var(--acc);color:var(--accink);border-color:var(--acc)}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:15px}
dt{color:var(--mute)}dd{margin:0}
.empty{color:var(--mute);font-style:italic}
.list{padding:10px 12px}
.row{display:grid;grid-template-columns:54px 12px 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:7px 2px}
.row:hover{background:color-mix(in srgb,var(--ink) 5%,transparent)}
.row .dt{color:var(--mute);font-size:14px}.row .dot{width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 0 1px var(--line)}
.row small{color:var(--mute)}
.hide{display:none!important}
footer{color:var(--mute);font-size:13px;margin-top:18px}
</style>
</head>
<body>
<div class="wrap">
<header>
 <h1>Calendrier des saints</h1>
 <div class="bar">
  <button class="btn" id="prevY" aria-label="Année précédente">‹</button>
  <strong id="yr" style="min-width:3.2em;text-align:center"></strong>
  <button class="btn" id="nextY" aria-label="Année suivante">›</button>
  <input type="date" id="pick" aria-label="Choisir une date">
  <button class="btn" id="today">Aujourd'hui</button>
  <button class="btn" id="vm" aria-pressed="true">Mois</button>
  <button class="btn" id="vl" aria-pressed="false">Année</button>
</div>
</header>
<div class="chips" id="chips" aria-label="Fêtes mobiles de l'année"></div>

<div class="grid2">
 <section class="card" id="left">
  <div id="monthV">
   <div class="mh"><button class="btn" id="prevM" aria-label="Mois précédent">‹</button><h2 id="mt"></h2><button class="btn" id="nextM" aria-label="Mois suivant">›</button></div>
   <div class="dow"><span>lun</span><span>mar</span><span>mer</span><span>jeu</span><span>ven</span><span>sam</span><span>dim</span></div>
   <div class="days" id="days"></div>
  </div>
  <div id="listV" class="hide">
   <div class="mh"><input type="search" id="q" placeholder="Chercher un saint, un patronage…" style="width:100%"></div>
   <div class="list" id="list"></div>
  </div>
 </section>
 <article class="card" id="detail" aria-live="polite"></article>
</div>
<footer>Fêtes fixes par date, fêtes mobiles calculées à partir de Pâques. Données dérivées de ton fichier saint.json (2026).</footer>
</div>

<script>// Résolveur du calendrier liturgique perpétuel.
// Usage : const cal = creerCalendrier(donneesJSON); cal.getJour('2027-03-28')  (ou un objet Date)
(function (root) {
  const J = ['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
  const DAY = 86400000;
  const utc = (y, m, d) => new Date(Date.UTC(y, m - 1, d));
  const add = (d, n) => new Date(d.getTime() + n * DAY);
  const diff = (a, b) => Math.round((a - b) / DAY);
  const mmdd = d => String(d.getUTCMonth() + 1).padStart(2, '0') + '-' + String(d.getUTCDate()).padStart(2, '0');
  const iso = d => d.getUTCFullYear() + '-' + mmdd(d);

  function paques(y) {
    const a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4;
    const f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3);
    const h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4;
    const l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451);
    const mo = Math.floor((h + l - 7 * m + 114) / 31), da = ((h + l - 7 * m + 114) % 31) + 1;
    return utc(y, mo, da);
  }

  function ancres(y) {
    let ep = utc(y, 1, 2);
    while (ep.getUTCDay() !== 0) ep = add(ep, 1);
    const bap = ep.getUTCDate() <= 6 ? add(ep, 7) : add(ep, 1);   // lundi si Épiphanie le 7 ou 8
    const d25 = utc(y, 12, 25);
    const s = (d25.getUTCDay()) || 7;                              // jours depuis le dimanche précédent
    const adv1 = add(d25, -s - 21);
    return { E: paques(y), ep, bap, adv1, ck: add(adv1, -7) };
  }

  function creerCalendrier(data) {
    const { fixes, mobiles, lectures, _meta } = data;
    const parOffset = {};
    for (const [off, k] of Object.entries(_meta.pascal)) parOffset[off] = k;

    function mobile(d, A) {
      const e = diff(d, A.E);
      if (parOffset[e] !== undefined) return parOffset[e];
      if (+d === +A.ep) return 'epiphanie';
      if (+d === +A.bap) return 'bapteme';
      if (+d === +A.adv1) return 'avent1';
      if (+d === +A.ck) return 'christ_roi';
      return null;
    }

    function temps(d, A) {
      const e = diff(d, A.E), y = d.getUTCFullYear();
      if (d >= utc(y, 12, 25) || d <= A.bap) return 'Temps de Noël';
      if (d >= A.adv1) return "Temps de l'Avent";
      if (e < -46) return 'Temps Ordinaire (1ère partie)';
      if (e < -7) return 'Carême';
      if (e < 0) return 'Semaine Sainte';
      if (e <= 7) return 'Octave de Pâques';
      if (e <= 49) return 'Temps Pascal';
      return 'Temps Ordinaire';
    }
    const COUL = { 'Temps de Noël': 'blanc', "Temps de l'Avent": 'violet', 'Carême': 'violet', 'Semaine Sainte': 'violet',
      'Octave de Pâques': 'blanc', 'Temps Pascal': 'blanc', 'Temps Ordinaire': 'vert', 'Temps Ordinaire (1ère partie)': 'vert' };

    function cleLecture(d, A) {
      const e = diff(d, A.E), wd = d.getUTCDay(), y = d.getUTCFullYear();
      if (e >= -46 && e <= 49) return 'P' + (e >= 0 ? '+' : '-') + Math.abs(e);
      if (d >= A.adv1) {
        if (d >= utc(y, 12, 17)) return mmdd(d);
        return 'AV' + (1 + Math.floor(diff(d, A.adv1) / 7)) + '-' + wd;
      }
      if (d <= A.bap) {
        if (d.getUTCMonth() === 0 && d.getUTCDate() >= 2 && d < A.ep) return mmdd(d);
        if (+d === +A.ep) return 'epiphanie';
        if (+d === +A.bap) return 'bapteme';
        if (d > A.ep) return 'EP+' + diff(d, A.ep);
        return mmdd(d);
      }
      if (e < -46) {
        const m1 = A.bap.getUTCDay() === 1 ? A.bap : add(A.bap, 1);
        const w = wd === 0 ? 2 + Math.floor(diff(d, add(m1, 6)) / 7) : 1 + Math.floor(diff(d, m1) / 7);
        return 'TO' + w + '-' + wd;
      }
      const m34 = add(A.ck, 1);
      let w;
      if (wd === 0) w = 34 - Math.floor(diff(A.ck, d) / 7);
      else w = 34 - Math.floor(diff(m34, add(d, -((wd + 6) % 7))) / 7);
      return 'TO' + w + '-' + wd;
    }

    function getJour(date) {
      let d;
      if (typeof date === 'string') { const [y, m, dd] = date.slice(0, 10).split('-').map(Number); d = utc(y, m, dd); }
      else d = utc(date.getFullYear(), date.getMonth() + 1, date.getDate());
      const A = ancres(d.getUTCFullYear());
      const fixe = fixes[mmdd(d)] || null;
      const mk = mobile(d, A);
      const mob = mk ? mobiles[mk] : null;
      const tl = temps(d, A);

      let principal = fixe, sec = [], lecKey;
      let res;
      if (mob && (!fixe || mob.rang <= fixe.rang)) {
        res = { ...mob, saints_secondaires: [...mob.saints_secondaires] };
        if (fixe) {
          if (_meta.composites[mk] === fixe.saint_principal) res.saint_principal += ' — ' + fixe.saint_principal;
          else res.saints_secondaires.push(fixe.saint_principal, ...fixe.saints_secondaires);
        }
        res.lecture_evangile_ordinaire = lectures[mk] ?? null;
        res.fete_mobile = mk;
      } else if (fixe) {
        res = { ...fixe, saints_secondaires: [...fixe.saints_secondaires] };
        if (mob) res.saints_secondaires.push(mob.saint_principal);
        const k = mmdd(d);
        res.lecture_evangile_ordinaire = lectures[k] ?? lectures[cleLecture(d, A)] ?? null;
      } else {
        res = { saint_principal: null, saints_secondaires: [], degre: 'férie', couleur_liturgique: null, rang: 5,
          fete_obligatoire: false, indulgences_speciales: null, patronages: [],
          lecture_evangile_ordinaire: lectures[cleLecture(d, A)] ?? null };
      }
      if (res.couleur_liturgique === null) res.couleur_liturgique = COUL[tl];
      return { date: iso(d), jour: J[d.getUTCDay()], ...res, temps_liturgique: tl };
    }
    return { getJour, paques, ancres };
  }

  if (typeof module !== 'undefined' && module.exports) module.exports = { creerCalendrier };
  else root.creerCalendrier = creerCalendrier;
})(typeof globalThis !== 'undefined' ? globalThis : this);
</script>

const cal=creerCalendrier(DATA);
const MOIS=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
const iso=(y,m,d)=>y+'-'+pad(m+1)+'-'+pad(d);
const fromIso=s=>{const [y,m,d]=s.split('-').map(Number);return {y,m:m-1,d}};
const now=new Date();
let cur=iso(now.getFullYear(),now.getMonth(),now.getDate());
let vy=now.getFullYear(),vm=now.getMonth(),mode='m';
const todayIso=cur;
const CSS={blanc:'var(--blanc)',vert:'var(--vert)',rouge:'var(--rouge)',violet:'var(--violet)'};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const col=r=>CSS[r.couleur_liturgique]||'var(--line)';

function chips(){
 const A=cal.ancres(vy),E=A.E,add=(d,n)=>new Date(E.getTime()+n*864e5);
 const f=d=>iso(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate());
 const L=[['Cendres',add(E,-46)],['Pâques',E],['Ascension',add(E,39)],['Pentecôte',add(E,49)],['1er Avent',A.adv1]];
 $('chips').innerHTML=L.map(([n,d])=>{const s=f(d),p=fromIso(s);return `<button class="chip" data-d="${s}"><b>${n}</b> ${p.d} ${MOIS[p.m]}</button>`}).join('');
}
function month(){
 $('yr').textContent=vy;$('mt').textContent=MOIS[vm]+' '+vy;
 const first=new Date(Date.UTC(vy,vm,1)),lead=(first.getUTCDay()+6)%7;
 let h='';
 for(let i=0;i<42;i++){
  const dt=new Date(Date.UTC(vy,vm,1-lead+i)),s=iso(dt.getUTCFullYear(),dt.getUTCMonth(),dt.getUTCDate());
  const r=cal.getJour(s),off=dt.getUTCMonth()!==vm;
  h+=`<button class="d${off?' off':''}${s===cur?' sel':''}${s===todayIso?' today':''}${r.rang<=2?' sol':''}" data-d="${s}" aria-label="${s} ${esc(r.saint_principal||'')}" style="--c:${col(r)}"><span class="n">${dt.getUTCDate()}</span><span class="s">${esc(r.saint_principal||'')}</span><i></i></button>`;
 }
 $('days').innerHTML=h;
}
function list(){
 const q=$('q').value.trim().toLowerCase(),n=(vy%4==0&&vy%100!=0)||vy%400==0?366:365;
 let h='';
 for(let i=0;i<n;i++){
  const dt=new Date(Date.UTC(vy,0,1+i)),s=iso(vy,dt.getUTCMonth(),dt.getUTCDate()),r=cal.getJour(s);
  const hay=[r.saint_principal,...r.saints_secondaires,...r.patronages,r.temps_liturgique,r.degre].join(' ').toLowerCase();
  if(q&&!hay.includes(q))continue;
  h+=`<button class="row" data-d="${s}" style="--c:${col(r)}"><span class="dt">${dt.getUTCDate()} ${MOIS[dt.getUTCMonth()].slice(0,4)}.</span><span class="dot"></span><span>${esc(r.saint_principal||'—')}</span><small>${esc(r.degre)}</small></button>`;
 }
 $('list').innerHTML=h||'<p class="empty">Aucun résultat pour cette année.</p>';
}
function detail(){
 const r=cal.getJour(cur),p=fromIso(cur);
 const acc=col(r);
 $('detail').style.setProperty('--acc',acc);$('detail').style.setProperty('--accink',r.couleur_liturgique==='blanc'?'#1d2430':'#fff');
 const row=(k,v)=>v?`<dt>${k}</dt><dd>${v}</dd>`:'';
 $('detail').innerHTML=`<div class="band"></div><div class="det">
  <p class="when">${r.jour} ${p.d} ${MOIS[p.m]} ${p.y}</p>
  <h2>${esc(r.saint_principal||'Pas de saint dans les données')}</h2>
  <div class="tags"><span class="tag c">${esc(r.degre)}</span><span class="tag">${esc(r.temps_liturgique)}</span><span class="tag">couleur : ${esc(r.couleur_liturgique)}</span>${r.fete_obligatoire?'<span class="tag">fête d\'obligation</span>':''}</div>
  <dl>${row('Évangile',r.lecture_evangile_ordinaire?esc(r.lecture_evangile_ordinaire):'<span class="empty">non renseigné pour ce jour</span>')}
  ${row('Aussi fêtés',r.saints_secondaires.map(esc).join(', '))}
  ${row('Patron de',r.patronages.map(esc).join(', '))}
  ${row('Indulgence',esc(r.indulgences_speciales||''))}
  ${row('Fête mobile',r.fete_mobile?esc(r.fete_mobile.replace(/_/g,' ')):'')}</dl></div>`;
}
function go(s){cur=s;const p=fromIso(s);vy=p.y;vm=p.m;$('pick').value=s;render()}
function render(){chips();month();if(mode==='l')list();detail()}
function setMode(m){mode=m;$('monthV').classList.toggle('hide',m!=='m');$('listV').classList.toggle('hide',m!=='l');$('vm').setAttribute('aria-pressed',m==='m');$('vl').setAttribute('aria-pressed',m==='l');render()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-d]');if(b)go(b.dataset.d)});
$('prevM').onclick=()=>{vm--;if(vm<0){vm=11;vy--}render()};
$('nextM').onclick=()=>{vm++;if(vm>11){vm=0;vy++}render()};
$('prevY').onclick=()=>{vy--;render()};$('nextY').onclick=()=>{vy++;render()};
$('today').onclick=()=>go(todayIso);
$('pick').onchange=e=>e.target.value&&go(e.target.value);
$('vm').onclick=()=>setMode('m');$('vl').onclick=()=>setMode('l');
$('q').oninput=list;
$('pick').value=cur;render();
</script>
</body>
</html>
